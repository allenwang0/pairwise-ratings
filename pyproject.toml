[project]
name = "pairwise-ratings"
version = "0.1.0"
description = "Elo, Glicko-2 and Bradley-Terry compared on simulated pairwise comparisons, with active pair selection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pairwise_ratings"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "jsonschema==4.26.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]
